# Base configuration shared across experiments.
# Model-specific configs inherit and override these values.

experiment:
  name: base
  seed: 42

data:
  dataset_name: bhavikjikadara/dog-and-cat-classification-dataset
  img_size: 64
  batch_size: 64
  num_workers: 2
  val_split: 0.15
  test_split: 0.15
  normalize:
    mean: [0.485, 0.456, 0.406]
    std:  [0.229, 0.224, 0.225]

trainer:
  max_epochs: 15
  accelerator: auto
  precision: 32
  log_every_n_steps: 20

callbacks:
  early_stopping:
    monitor: val_loss
    patience: 4
    mode: min
  checkpoint:
    monitor: val_acc
    mode: max
    save_top_k: 1
  lr_monitor:
    logging_interval: epoch

paths:
  checkpoints: checkpoints
  reports: reports
